[MISSION]
objective = Exploration
map_dimension = Medium
seed = 19
drones = 3
wall_completion_tolerance_pixels = 30

[SLAM]
scan_interval = 0.25
scan_rays = 60
point_cloud_max_points = 6000

[SHARING]
drone_interval = 0.5
pair_cooldown = 1.2
rover_interval = 0.5
compare_stride = 8
min_new_info_ratio = 0.04
min_overlap_diff_ratio = 0.18
min_roughness_delta = 0.12

[FRONTIER]
confidence_threshold = 0.6
stride = 4
rebuild_cooldown = 0.25
minimum_cluster_cells = 12
minimum_unknown_support_cells = 64
distance_band = 16.0
wall_continuation_weight = 2.0
cluster_size_weight = 2.0
cluster_proximity_weight = 1.0
global_cell_size = 32
global_refresh_interval = 2.0
global_ownership_weight = 2.0
maximum_path_circuity = 4.0

[EXPLORATION]
policy = random
stagnation_distance = 120.0
stagnation_min_sensor_cells_per_px = 0.5
wall_direction_bias = 4.0
unexplored_direction_bias = 2.0
separation_direction_bias = 1.5
coverage_memory_cell_size = 32
coverage_memory_decay_seconds = 180.0
coverage_visit_weight = 1.5
coverage_edge_weight = 2.0

[INCIDENTAL_SCAN]
mode = active
maximum_attempts_per_directive = 2
maximum_wait_seconds_per_directive = 6.0
attempt_timeout_seconds = 3.0
maximum_rotation_degrees_per_directive = 180.0
distance_cooldown_sensor_ranges = 1.0
sample_spacing_sensor_ranges = 0.5

[HIGHWAY]
mode = active
macro_cell_size = 32
# Legacy tiled-size key; retained for compatibility, unused by the corridor builder.
# Smaller access distance produces more capillaries. Uses the drone LiDAR range.
maximum_access_distance_sensor_ranges = 2.0
minimum_version_delta = 1
maximum_build_ms = 250.0
maximum_query_ms = 50.0
maximum_connector_expansions = 4096
minimum_route_sensor_ranges = 2.0
maximum_route_circuity = 3.0

[FOCUSED_FRONTIER_BATCH]
mode = active
maximum_claimed_components = 3
maximum_total_components = 4
lease_margin_sensor_ranges = 1.0
maximum_detour_sensor_ranges = 2.0
minimum_avoided_round_trip_sensor_ranges = 0.25
maximum_service_seconds = 45.0
maximum_total_dfs_nodes = 48
maximum_consecutive_low_gain_scans = 2
low_gain_maximum_new_cells = 1
low_gain_maximum_confidence_gain = 1.0
maximum_planning_ms = 250.0
maximum_route_queries = 128

[RENDERING]
slam_point_tail = 400
slam_refresh_interval = 0.1

[TRACE]
enabled = true
directory = logs
frame_interval = 1.0

